version: '3.9'
services:
  backend:
    build: ../../backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - '8000:8000'

  flask_service:
    build: ../../flask_service
    command: python run.py
    environment:
      - BACKEND_URL=http://backend:8000/api
    depends_on:
      - backend
    ports:
      - '5001:5001'

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../../frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - '5173:5173'
